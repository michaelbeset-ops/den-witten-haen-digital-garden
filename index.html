<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <title>Den Witten Haen | Lunchroom in Dordrecht</title>
    <meta name="description" content="Den Witten Haen is een sfeervolle lunchroom in het hart van Dordrecht. Geniet van lunch, high tea en meer in een monumentaal pand met verborgen stadstuin." />

    <meta property="og:title" content="Den Witten Haen | Lunchroom in Dordrecht" />
    <meta property="og:description" content="Lunch, high tea en meer in het hart van Dordrecht." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://denwittenhaen.com/" />
    <meta property="og:locale" content="nl_NL" />
    <link rel="canonical" href="https://denwittenhaen.com/" />
    <meta name="theme-color" content="#2c1f0f" />

    <!--
      Content Security Policy. GitHub Pages kan geen HTTP-headers zetten, dus
      staat het beleid hier als meta-tag. Dat werkt voor alles behalve
      frame-ancestors; die richtlijn wordt in een meta-tag genegeerd.

      De twee sha256-waarden horen bij de twee inline scripts verderop in dit
      bestand (de structured data en de routing-fix). Wijzig je een van die
      scripts, ook maar één spatie, dan moet de bijbehorende hash mee. De
      nieuwe waarde staat in de console van de browser in de foutmelding.

      'unsafe-inline' bij style-src is onvermijdelijk: React en de
      UI-componenten zetten stijlen als style-attribuut op elementen, en
      daarvoor bestaat geen hash. Voor scripts, waar het risico zit, wordt het
      niet gebruikt.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'self';
               object-src 'none';
               form-action 'self';
               img-src 'self' data: blob:;
               font-src 'self';
               style-src 'self' 'unsafe-inline';
               script-src 'self' 'sha256-jxUCs+3c4P1UU6T4giMbvgwYQVIhzm9O4nMQjMKX6jU=' 'sha256-+2g9rAYrpHF+60noEEKmNBwamPa9wPMDvfvV7T3Bo3E=';
               connect-src 'self' https://*.supabase.co wss://*.supabase.co;
               frame-src 'none';
               upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Structured data (openingstijden e.d.) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CafeOrCoffeeShop",
        "name": "Den Witten Haen",
        "description": "Sfeervolle lunchroom in het hart van Dordrecht. Lunch, high tea en meer in een monumentaal pand met verborgen stadstuin.",
        "servesCuisine": ["Lunch", "High tea"],
        "telephone": "+31786112050",
        "email": "denwittenhaen@philadelphia.nl",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Groenmarkt 19-B",
          "postalCode": "3311 BD",
          "addressLocality": "Dordrecht",
          "addressCountry": "NL"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "10:00",
            "closes": "16:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",
            "opens": "10:00",
            "closes": "17:00"
          }
        ]
      }
    </script>

    <!-- GitHub Pages SPA routing fix -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
